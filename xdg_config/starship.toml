scan_timeout = 800
command_timeout = 1600

# shpool session name, right-aligned on the input line (zsh hides it when
# the command reaches it and redraws it on resize).
right_format = "${env_var.SHPOOL_SESSION_NAME}"

[aws]
symbol = "  "

[buf]
symbol = " "

[c]
symbol = " "

[conda]
symbol = " "

[dart]
symbol = " "

[directory]
read_only = " "

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[git_branch]
symbol = " "

[golang]
symbol = " "

[haskell]
symbol = " "

[hg_branch]
symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[lua]
symbol = " "

[memory_usage]
symbol = " "

[nim]
symbol = " "

[nix_shell]
symbol = " "

[nodejs]
symbol = " "

[package]
symbol = " "

[python]
symbol = " "

[rlang]
symbol = "ﳒ "

[ruby]
symbol = " "

[rust]
symbol = " "

[spack]
symbol = "🅢 "

[env_var.SHPOOL_SESSION_NAME]
variable = "SHPOOL_SESSION_NAME"
symbol = " "
format = "[$symbol$env_value]($style)"
style = "bold purple"
